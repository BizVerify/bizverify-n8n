name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, required for OIDC trusted publishing.
          # (Self-upgrading npm 10.x in place breaks on the hosted runner.)
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      # No NODE_AUTH_TOKEN: auth + provenance come from OIDC trusted publishing.
      - run: npm publish --access public
